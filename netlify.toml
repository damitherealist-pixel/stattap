[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Security headers on every page
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Clean page addresses
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/demo"
  to = "/demo.html"
  status = 200

# Public sign-up was replaced by demo requests; old links land on the demo form.
[[redirects]]
  from = "/signup"
  to = "/demo"
  status = 301

# Business review pages: stattap.net/<business-address> shows the review page.
# Real files (index, login, signup, admin.html, review.html, images) are served first.
[[redirects]]
  from = "/:slug"
  to = "/review.html"
  status = 200
