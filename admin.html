<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e1116">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="favicon.png">
<title>Stat Tap Owner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img src="stattap-mark.png" alt="" class="brand-mark" width="44" height="45">
      <div><img src="stattap-word.png" alt="Stat Tap" class="brand-word" width="134" height="17"><small>Owner console</small></div>
    </div>
    <div class="row" id="nav" hidden>
      <div class="tabs" role="tablist">
        <button role="tab" data-view="list" aria-selected="true">Businesses</button>
        <button role="tab" data-view="account" aria-selected="false">Account</button>
      </div>
      <button class="btn" id="signOut">Sign out</button>
    </div>
  </header>

  <!-- Owner sign in / first-time setup -->
  <section id="authView" class="panel auth" hidden>
    <form id="authForm" class="form">
      <h2 id="authTitle">Owner sign in</h2>
      <p class="note" id="authIntro" hidden>Create the owner password for this console. Use at least 8 characters and keep it somewhere safe.</p>
      <label for="aPass"><span id="passLabel">Owner password</span><input id="aPass" type="password" autocomplete="current-password" required></label>
      <label for="aPass2" id="pass2Wrap" hidden>Type it again<input id="aPass2" type="password" autocomplete="new-password"></label>
      <label class="row" style="font-weight:500;gap:8px" for="showPw"><input type="checkbox" id="showPw"> Show password</label>
      <button class="btn primary" type="submit" id="authBtn">Sign in</button>
      <div class="error" id="authMsg" role="alert"></div>
    </form>
  </section>

  <main id="main"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="app.js"></script>
<script>
const { $, esc, api, fmt, deltaHtml, copy, reviewLink } = RD;
const KEY = 'rd-owner-token';
let view = 'list', clients = [], editing = null, confirmDel = null, confirmReset = null, dash = null, setupMode = false, creds = null, listMsg = '';
let industries = [], support = '';
api('industries').then((d) => { industries = d.industries || []; if (view === 'form') renderForm(); }).catch(() => {});
try { RD.token = localStorage.getItem(KEY); } catch (e) {}
const setToken = (t) => { RD.token = t; try { t ? localStorage.setItem(KEY, t) : localStorage.removeItem(KEY); } catch (e) {} };

/* ---------- Auth ---------- */
function signOut() { setToken(null); if (dash) dash.destroy(); dash = null; $('#main').innerHTML = ''; show(); }
RD.onUnauthorized = signOut;
async function checkSetup() {
  try { setupMode = !!(await api('setup')).needsSetup; } catch (e) { setupMode = false; }
  $('#authTitle').textContent = setupMode ? 'Create your owner password' : 'Owner sign in';
  $('#authIntro').hidden = !setupMode; $('#pass2Wrap').hidden = !setupMode;
  $('#passLabel').textContent = setupMode ? 'New password' : 'Owner password';
  $('#authBtn').textContent = setupMode ? 'Create password and sign in' : 'Sign in';
}
function show() {
  const inApp = !!RD.token;
  $('#authView').hidden = inApp; $('#nav').hidden = !inApp;
  if (!inApp) { checkSetup(); return; }
  go(view === 'dash' ? 'list' : view);
}
$('#showPw').addEventListener('change', (e) => { const t = e.target.checked ? 'text' : 'password'; $('#aPass').type = t; $('#aPass2').type = t; });
$('#authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = $('#aPass').value.trim(); $('#authBtn').disabled = true; $('#authMsg').textContent = '';
  try {
    let d;
    if (setupMode) {
      if (pw.length < 8) throw new Error('Use at least 8 characters.');
      if (pw !== $('#aPass2').value.trim()) throw new Error("The two passwords don't match.");
      d = await api('setup', { method: 'POST', body: JSON.stringify({ password: pw }) });
    } else {
      d = await api('login', { method: 'POST', body: JSON.stringify({ role: 'owner', password: pw }) });
    }
    setToken(d.token); $('#authForm').reset(); show();
  } catch (err) { $('#authMsg').textContent = err.message; if (err.status === 409) checkSetup(); }
  finally { $('#authBtn').disabled = false; }
});
$('#signOut').addEventListener('click', signOut);
$('#nav').addEventListener('click', (e) => { const b = e.target.closest('[data-view]'); if (b) go(b.dataset.view); });

/* ---------- Views ---------- */
function go(v) {
  view = v;
  document.querySelectorAll('#nav [data-view]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.view === (v === 'form' || v === 'dash' ? 'list' : v))));
  if (dash && v !== 'dash') { dash.destroy(); dash = null; }
  if (v === 'list') { renderList(); loadClients(); }
  if (v === 'form') renderForm();
  if (v === 'account') { renderAccount(); api('support').then((d) => { support = d.contact || ''; const el = $('#supContact'); if (el && !el.value) el.value = support; }).catch(() => {}); }
}
async function loadClients() {
  try { clients = (await api('admin/clients')).clients; listMsg = ''; }
  catch (e) { listMsg = e.message; }
  if (view === 'list') renderList();
}

function trend(c) {
  const a = c.stats.week.avg, b = c.stats.prev.avg;
  return a != null && b != null ? a - b : null;
}
function renderList() {
  const thisWeek = clients.reduce((n, c) => n + c.stats.week.n, 0);
  const sum = clients.reduce((s, c) => s + (c.stats.week.avg || 0) * c.stats.week.n, 0);
  const declining = clients.filter((c) => (trend(c) ?? 0) <= -0.1).length;
  $('#main').innerHTML = `
    <div class="stack">
      <div class="kpis">
        <div class="kpi"><span>Businesses</span><b>${clients.length}</b></div>
        <div class="kpi"><span>Reviews, last 7 days</span><b>${thisWeek}</b></div>
        <div class="kpi"><span>Average, last 7 days</span><b>${thisWeek ? fmt(sum / thisWeek) : '–'}</b></div>
        <div class="kpi"><span>Declining this week</span><b class="${declining ? 'down' : ''}">${declining}</b></div>
      </div>
      <div class="row spread"><h2>Businesses</h2><button class="btn primary" data-act="add">Add business</button></div>
      ${listMsg ? `<div class="error">${esc(listMsg)}</div>` : ''}
      <div class="grid2">${clients.length ? clients.map(card).join('') : '<div class="panel empty" style="grid-column:1/-1">No businesses yet. Add your first one to create its review link and client login.</div>'}</div>
    </div>`;
}
function card(c) {
  const d = trend(c);
  return `<article class="panel biz">
    <div class="row spread"><div class="row"><span class="dot" style="background:${esc(c.color)}"></span><h3>${esc(c.name)}</h3></div>
      ${c.selfSignup ? '<span class="pill on">Signed up online</span>' : ''}</div>
    <p class="note mono">${esc(reviewLink(c))}</p>
    <div class="row" style="gap:18px;font-variant-numeric:tabular-nums">
      <span><span class="note">Last 7 days</span><br><b style="font-family:var(--display);font-size:1.25rem">${fmt(c.stats.week.avg)}</b> ${d != null ? deltaHtml(d) : ''}</span>
      <span><span class="note">Reviews this week</span><br><b style="font-family:var(--display);font-size:1.25rem">${c.stats.week.n}</b></span>
      <span><span class="note">All time</span><br><b style="font-family:var(--display);font-size:1.25rem">${c.stats.total}</b></span>
    </div>
    <p class="note">${c.hasLogin ? 'Client login: ' + esc(c.loginEmail) + (c.mustChange ? ' · <span style="color:var(--warn)">Waiting for them to set a new password</span>' : '') : '<span class="pill warn">No client login yet</span>'}${c.google ? '' : ' · <span style="color:var(--warn)">No Google link yet, so customers aren\'t sent to Google</span>'}</p>
    <div class="row">
      <button class="btn primary" data-open="${c.id}">Open dashboard</button>
      <button class="btn" data-edit="${c.id}">Edit</button>
      <button class="btn" data-link="${c.id}">Copy review link</button>
      ${c.hasLogin ? (confirmReset === c.id
        ? `<button class="btn primary" data-resetyes="${c.id}">Make a temporary password</button><button class="btn" data-act="resetno">Cancel</button>`
        : `<button class="btn" data-reset="${c.id}">Reset password</button>`) : ''}
      ${confirmDel === c.id ? `<button class="btn danger" data-delyes="${c.id}">Delete business and its reviews</button><button class="btn" data-act="delno">Keep</button>` : `<button class="btn danger" data-del="${c.id}">Delete</button>`}
    </div>
  </article>`;
}
function genPassword() {
  const a = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  const r = new Uint32Array(12); crypto.getRandomValues(r);
  return Array.from(r, (x) => a[x % a.length]).join('');
}
function renderForm() {
  const c = editing || { name: '', slug: '', industry: 'restaurant', google: '', contact: '', color: '#8fa2ff', loginEmail: '', hasLogin: false };
  if (creds) {
    $('#main').innerHTML = `
      <div class="panel stack" style="max-width:640px">
        <h2>Send these sign-in details to ${esc(creds.name)}</h2>
        <div class="callout">
          <dl class="creds"><dt>Sign-in page</dt><dd>${esc(location.origin)}/login</dd><dt>Email</dt><dd>${esc(creds.email)}</dd><dt>${creds.reset ? 'Temporary password' : 'Password'}</dt><dd>${esc(creds.password)}</dd></dl>
        </div>
        <p class="note">This is the only time the password is shown. The first time they sign in, they'll be asked to choose their own password.${creds.reset ? ' Their old password no longer works.' : ''}</p>
        <div class="row"><button class="btn primary" data-act="copycreds">Copy details</button><button class="btn" data-act="done">Done</button></div>
      </div>`;
    return;
  }
  $('#main').innerHTML = `
    <form id="clientForm" class="panel form" style="max-width:720px">
      <div class="row spread"><h2>${editing ? 'Edit ' + esc(c.name) : 'Add a business'}</h2><button class="btn ghost" type="button" data-act="cancel">Cancel</button></div>
      <label for="fName">Business name<input id="fName" type="text" required maxlength="160" value="${esc(c.name)}" placeholder="e.g. Luna Bistro"></label>
      <label for="fGoogle">Google review link or Place ID <small>From the business's Google Business Profile, under "Ask for reviews".</small><input id="fGoogle" type="text" value="${esc(c.google)}" placeholder="https://g.page/r/.../review"></label>
      <label for="fContact">Contact for unhappy guests <small>Shown to guests who rate 1–3 stars.</small><input id="fContact" type="text" value="${esc(c.contact)}" placeholder="manager@restaurant.com or phone"></label>
      <label for="fSlug">StatTap address <small>Letters, numbers and dashes. The review page opens at ${esc(location.origin)}/<b>address</b>. Leave blank to keep the long link.</small><input id="fSlug" type="text" value="${esc(c.slug || '')}" placeholder="luna-bistro" autocapitalize="off" spellcheck="false"></label>
      ${editing
        ? `<p class="note">Questions: ${esc((c.questions || []).map((q) => q.label).join(', '))}. These stay fixed so old and new scores line up.</p>`
        : `<label for="fInd">Type of business <small>Loads the five rating questions for that industry.</small><select id="fInd">${(industries.length ? industries : [{ id: 'restaurant', name: 'Restaurants' }]).map((x) => `<option value="${esc(x.id)}" ${x.id === c.industry ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>`}
      <label for="fColor">Brand color<input id="fColor" type="color" value="${esc(c.color)}"></label>
      <p class="note">Every customer is offered this business's Google review page after they submit, whatever their rating. This can't be turned off, which keeps every business within Google's rules.</p>
      <h3 style="margin-top:8px">Client login</h3>
      <p class="note">The business owner signs in at <span class="mono">${esc(location.origin)}/login</span> and sees only this business. They can never open this owner console.</p>
      <label for="fEmail">Login email<input id="fEmail" type="email" value="${esc(c.loginEmail)}" placeholder="owner@lunabistro.com" autocomplete="off"></label>
      <label for="fPass">${c.hasLogin ? 'New password <small>Leave blank to keep their current password. Or use Reset password on the business card.</small>' : 'Password <small>At least 8 characters. They choose their own the first time they sign in.</small>'}
        <span class="row" style="flex-wrap:nowrap"><input id="fPass" type="text" autocomplete="off" style="flex:1;min-width:0"><button class="btn" type="button" data-act="gen">Generate</button></span></label>
      <div class="row"><button class="btn primary" type="submit" id="fSave">${editing ? 'Save changes' : 'Add business'}</button><span class="error" id="fMsg" role="alert"></span></div>
    </form>`;
}
function renderAccount() {
  $('#main').innerHTML = `
    <div class="grid2">
      <form id="ownerPw" class="panel form">
        <h2>Change owner password</h2>
        <label for="oCur">Current password<input id="oCur" type="password" autocomplete="current-password" required></label>
        <label for="oNew">New password <small>At least 8 characters</small><input id="oNew" type="password" autocomplete="new-password" required minlength="8"></label>
        <div class="row"><button class="btn primary" type="submit">Update password</button><span class="note" id="oMsg" role="status"></span></div>
      </form>
      <form id="supportForm" class="panel form">
        <h2>Support contact</h2>
        <p class="note">Shown on the client login page under "Forgot your password?", so clients know how to reach you for a reset.</p>
        <label for="supContact">Phone or email<input id="supContact" type="text" maxlength="200" value="${esc(support)}" placeholder="support@stattap.net or (555) 010-0100"></label>
        <div class="row"><button class="btn primary" type="submit">Save</button><span class="note" id="supMsg" role="status"></span></div>
      </form>
      <div class="panel stack">
        <h2>Sign-in pages</h2>
        <div><div class="note">Clients sign in here</div><div class="mono">${esc(location.origin)}/login</div></div>
        <div><div class="note">New businesses sign up here</div><div class="mono">${esc(location.origin)}/signup</div></div>
        <div><div class="note">You sign in here. Keep this address private.</div><div class="mono">${esc(location.origin)}/admin.html</div></div>
      </div>
    </div>`;
}

$('#main').addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const find = (id) => clients.find((c) => c.id === id);
  if (b.dataset.act === 'add') { editing = null; creds = null; go('form'); }
  if (b.dataset.edit) { editing = find(b.dataset.edit); creds = null; go('form'); }
  if (b.dataset.act === 'cancel' || b.dataset.act === 'done') { creds = null; editing = null; go('list'); }
  if (b.dataset.act === 'gen') { $('#fPass').value = genPassword(); }
  if (b.dataset.act === 'copycreds' && creds) copy(`Your StatTap sign-in\nPage: ${location.origin}/login\nEmail: ${creds.email}\n${creds.reset ? 'Temporary password' : 'Password'}: ${creds.password}\nYou'll choose your own password when you sign in.`, b);
  if (b.dataset.link) copy(reviewLink(find(b.dataset.link) || b.dataset.link), b);
  if (b.dataset.reset) { confirmReset = b.dataset.reset; renderList(); }
  if (b.dataset.act === 'resetno') { confirmReset = null; renderList(); }
  if (b.dataset.resetyes) {
    try {
      const d = await api('admin/reset-password', { method: 'POST', body: JSON.stringify({ id: b.dataset.resetyes }) });
      confirmReset = null; creds = { name: d.name, email: d.email, password: d.password, reset: true }; view = 'form'; renderForm();
    } catch (err) { listMsg = err.message; confirmReset = null; renderList(); }
  }
  if (b.dataset.del) { confirmDel = b.dataset.del; renderList(); }
  if (b.dataset.act === 'delno') { confirmDel = null; renderList(); }
  if (b.dataset.delyes) {
    try { await api('admin/clients?id=' + encodeURIComponent(b.dataset.delyes), { method: 'DELETE' }); } catch (err) { listMsg = err.message; }
    confirmDel = null; loadClients();
  }
  if (b.dataset.open) {
    view = 'dash';
    $('#main').innerHTML = '<div id="dashRoot"></div>';
    dash = RD.Dashboard($('#dashRoot'), { clientId: b.dataset.open, isOwner: true, onBack: () => go('list') });
  }
});
$('#main').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (e.target.id === 'clientForm') {
    const pw = $('#fPass').value.trim(), email = $('#fEmail').value.trim();
    $('#fSave').disabled = true; $('#fMsg').textContent = '';
    try {
      const c = await api('admin/clients', { method: 'POST', body: JSON.stringify({
        id: editing?.id, name: $('#fName').value, google: $('#fGoogle').value, contact: $('#fContact').value,
        color: $('#fColor').value, slug: $('#fSlug').value.trim().toLowerCase(), industry: $('#fInd') ? $('#fInd').value : undefined, loginEmail: email, password: pw }) });
      if (pw) { creds = { name: c.name, email: c.loginEmail, password: pw }; renderForm(); }
      else { editing = null; go('list'); }
    } catch (err) { $('#fMsg').textContent = err.message; }
    finally { const s = $('#fSave'); if (s) s.disabled = false; }
  }
  if (e.target.id === 'supportForm') {
    try { const d = await api('admin/support', { method: 'POST', body: JSON.stringify({ contact: $('#supContact').value }) }); support = d.contact; $('#supMsg').textContent = 'Saved.'; }
    catch (err) { $('#supMsg').textContent = err.message; }
  }
  if (e.target.id === 'ownerPw') {
    try {
      const d = await api('admin/password', { method: 'POST', body: JSON.stringify({ current: $('#oCur').value, password: $('#oNew').value }) });
      setToken(d.token); e.target.reset(); $('#oMsg').textContent = 'Password updated.';
    } catch (err) { $('#oMsg').textContent = err.message; }
  }
});
show();
</script>
</body>
</html>
